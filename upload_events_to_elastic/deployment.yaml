---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-events-to-elastic
  namespace: default
  labels:
    app: upload-events-to-elastic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload-events-to-elastic
  template:
    metadata:
      labels:
        app: upload-events-to-elastic
    spec:
      containers:
      - name: upload-events-api
        # Replace with your Docker image
        # You'll need to build and push this image to a registry
        # Example: image: your-registry/upload-events-to-elastic:latest
        image: upload-events-to-elastic:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
          name: http
          protocol: TCP
        env:
        - name: ELASTIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: elastic-api-key
              key: apiKey
        - name: ELASTIC_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: elastic-endpoint
              key: endpoint
        # OpenTelemetry environment variables (from secret, create with: kubectl create secret generic otel-exporter-otlp-endpoint --from-literal=endpoint=$OTEL_EXPORTER_OTLP_ENDPOINT)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: otel-exporter-otlp-endpoint
              key: endpoint
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=upload-events-to-elastic,service.version=1,deployment.environment=production"
        # Note: OTEL_EXPORTER_OTLP_HEADERS will be set programmatically in Python code
        # from ELASTIC_API_KEY to avoid Kubernetes secret interpolation issues
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: upload-events-to-elastic-service
  namespace: default
  labels:
    app: upload-events-to-elastic
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5001
    protocol: TCP
    name: http
  selector:
    app: upload-events-to-elastic
---
apiVersion: v1
kind: Service
metadata:
  name: upload-events-to-elastic-nodeport
  namespace: default
  labels:
    app: upload-events-to-elastic
spec:
  type: NodePort
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 30081
    protocol: TCP
    name: http
  selector:
    app: upload-events-to-elastic

