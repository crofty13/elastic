---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  namespace: default
  labels:
    app: main-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
    spec:
      containers:
      - name: main-service-api
        image: main-service:v4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: ELASTIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: elastic-api-key
              key: apiKey
        - name: ELASTIC_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: elastic-endpoint
              key: endpoint
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api-key
              key: apiKey
        # OpenTelemetry environment variables (from secret, create with: kubectl create secret generic otel-exporter-otlp-endpoint --from-literal=endpoint=$OTEL_EXPORTER_OTLP_ENDPOINT)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: otel-exporter-otlp-endpoint
              key: endpoint
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=main-service,service.version=1,deployment.environment=production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: main-service
  namespace: default
  labels:
    app: main-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: main-service
---
apiVersion: v1
kind: Service
metadata:
  name: main-service-nodeport
  namespace: default
  labels:
    app: main-service
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: main-service


