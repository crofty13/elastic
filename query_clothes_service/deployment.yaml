---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-clothes-service
  namespace: default
  labels:
    app: query-clothes-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-clothes-service
  template:
    metadata:
      labels:
        app: query-clothes-service
    spec:
      containers:
      - name: query-clothes-api
        image: query-clothes-service:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5003
          name: http
          protocol: TCP
        env:
        - name: ELASTIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: elastic-api-key
              key: apiKey
        - name: ELASTIC_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: elastic-endpoint
              key: endpoint
        # OpenTelemetry environment variables (from secret, create with: kubectl create secret generic otel-exporter-otlp-endpoint --from-literal=endpoint=$OTEL_EXPORTER_OTLP_ENDPOINT)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: otel-exporter-otlp-endpoint
              key: endpoint
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=query-clothes-service,service.version=1,deployment.environment=production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: query-clothes-service
  namespace: default
  labels:
    app: query-clothes-service
spec:
  type: ClusterIP
  ports:
  - port: 5003
    targetPort: 5003
    protocol: TCP
    name: http
  selector:
    app: query-clothes-service

